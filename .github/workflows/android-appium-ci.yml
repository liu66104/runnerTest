name: Android Appium CI

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, mac-appium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ===== 1. 构建 Android APK（你本地工程） =====
      - name: Grant execute permission for gradlew (gpf_android)
        run: chmod +x /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android/gradlew

      - name: Build Debug APK (gpf_android)
        working-directory: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android
        run: ./gradlew assembleStgDebug --stacktrace

      # ===== 2. 启动 Appium Server，显式绑定 127.0.0.1:4723 =====
      - name: Start Appium Server
        run: |
          if lsof -i :4723 > /dev/null 2>&1; then
            echo "Appium 已在 4723 端口运行，跳过启动"
          else
            echo "启动 Appium Server on 127.0.0.1:4723 ..."
            appium --address 127.0.0.1 --port 4723 --log-level error --log ./appium.log &
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium Server 已就绪"
                break
              fi
              sleep 2
            done
          fi

      # ===== 3. 执行 Appium 测试（java-automation 工程） =====
      - name: Run Appium Tests (java-automation)
        working-directory: /Users/psdcdmacmini/Desktop/GPF_CI/java-automation
        env:
          GPF_E2E_PLATFORM: android
          GPF_E2E_APP_PATH: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android/app/build/outputs/apk/stg/debug/app-stg-debug.apk
          # 如果要用真机/指定模拟器，取消下一行注释并填入 UDID
          # GPF_E2E_UDID: 你的设备UDID
        run: ./gradlew test --stacktrace

      # ===== 关键改动 3：APK 路径改成你本地工程的产物路径 =====
#      - name: Upload APK (optional)
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: debug-apk
#          path: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android/app/build/outputs/apk/stg/debug/*.apk
#          retention-days: 7

      # ===== 5. 清理 Appium 进程 =====
      - name: Stop Appium Server
        if: always()
        run: |
          pkill -f "appium" || true
