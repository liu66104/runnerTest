name: Android Appium CI

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-test:
    runs-on: [self-hosted, mac-appium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ===== 关键改动 1：进入你本地工程目录，赋权 =====
      - name: Grant execute permission for gradlew (local project)
        run: chmod +x /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android/gradlew

      # ===== 关键改动 2：用绝对路径在你本地工程里构建 =====
      - name: Build Debug APK (local project)
        working-directory: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android
        run: ./gradlew assembleStgDebug --stacktrace

      - name: Start Appium Server
        run: |
          if lsof -i :4723 > /dev/null 2>&1; then
            echo "Appium 已在 4723 端口运行，跳过启动"
          else
            echo "启动 Appium Server..."
            appium --log-level error --log ./appium.log &
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium Server 已就绪"
                break
              fi
              sleep 2
            done
          fi

      - name: Run Appium Tests (local project)
        working-directory: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android
        run: ./gradlew test --stacktrace

      # ===== 关键改动 3：APK 路径改成你本地工程的产物路径 =====
      - name: Upload APK (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: /Users/psdcdmacmini/Desktop/GPF_CI/gpf_android/app/build/outputs/apk/stg/debug/*.apk
          retention-days: 7

      - name: Stop Appium Server
        if: always()
        run: |
          pkill -f "appium" || true
