name: Android Appium CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-test:
    # 精准匹配你 Mac 上的 Runner（已配置标签 mac-appium）
    runs-on: [self-hosted, mac-appium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'   # 根据你的项目调整，java-client v9+ 需要 Java 11 以上

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Start Appium Server
        run: |
          # 先检查是否已有 Appium 在运行，避免端口冲突
          if lsof -i :4723 > /dev/null 2>&1; then
            echo "Appium 已在 4723 端口运行，跳过启动"
          else
            echo "启动 Appium Server..."
            appium --log-level error --log ./appium.log &
            # 等待服务就绪
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium Server 已就绪"
                break
              fi
              sleep 2
            done
          fi

      - name: Run Appium Tests
        run: |
          # 根据你的测试工程调整命令
          # 如果测试代码和应用在同一 Gradle 项目：
          ./gradlew test --stacktrace
          # 如果是独立模块，可改用：./gradlew :your-test-module:test

      - name: Upload APK (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Stop Appium Server
        if: always()
        run: |
          # 清理后台 Appium 进程
          pkill -f "appium" || true
